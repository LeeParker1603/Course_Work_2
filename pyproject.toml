[project]
name = "course-work-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Evgenia Gorobets",email = "leeparker1603@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]


line_length = 119
# максимальная длина строки
[tool.isort]


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
 /(
    \.eggs # Исключить несколько общих каталогов
    | \.git # в корне проекта
    | \.mypy_cache
    | \.venv
  )/
  | foo.py # Также отдельно исключить файл с именем foo.py
            # в корне проекта
)
'''

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'